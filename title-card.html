<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Title Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #ffffff;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
    }
    .box {
      border: 2px solid #38bdf8;
      padding: 2.5rem 3.5rem;
      border-radius: 14px;
      background: #1e293b;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 2.2rem;
    }
    p {
      margin: 0.45rem 0;
      font-size: 1.25rem;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Pranita Milind Divashikar</h1>
    <p>Assigned Track: Web Development and Designing</p>
    <p id="task-name">Task Title: Task 1: Landing Page</p>
  </div>
</body>
</html>
